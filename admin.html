<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адмін-панель - FoodMap</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <a href="index.html"><img src="images/logo.png" alt="Логотип FoodMap" width="150"></a>
        <nav>
            <ul>
                <li><a href="index.html">Вийти на сайт</a></li>
                <li><strong>Адміністратор</strong></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Панель керування закладами</h1>

        <section>
            <h2>Додати новий заклад</h2>
            <form action="#" method="POST">
                <label for="rest-name">Назва закладу:</label>
                <input type="text" id="rest-name" name="rest-name" required>

                <label for="rest-address">Адреса:</label>
                <input type="text" id="rest-address" name="rest-address" required>

                <label for="rest-rating">Рейтинг:</label>
                <input type="number" id="rest-rating" min="1" max="5" step="0.1">

                <button type="submit">Додати заклад</button>
            </form>
        </section>

        <section>
            <h2>Керування стравами (Меню)</h2>
            <table>
                <tr>
                    <th>Заклад</th>
                    <th>Страва</th>
                    <th>Ціна</th>
                    <th>Дія</th>
                </tr>
                <tr>
                    <td>Pervak</td>
                    <td>Борщ</td>
                    <td>180 грн</td>
                    <td><button type="button">Видалити</button></td>
                </tr>
            </table>
        </section>
    </main>
</body>
</html>
