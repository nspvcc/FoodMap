<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заклад - FoodMap</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/menu.js"></script>
    <script src="js/validation.js" defer></script>
    <script src="js/restaurant.js" defer></script>
</head>
<body>
    <header>
        <a class="logo" href="index.html">
            <img src="images/logo.png" alt="Логотип сервісу FoodMap" width="220">
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="main-nav" aria-label="Відкрити меню">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav id="main-nav" class="site-nav" aria-label="Головна навігація">
            <ul>
                <li><a href="index.html">Головна</a></li>
                <li><a href="search.html">Результати пошуку</a></li>
                <li><a href="restaurant.html" aria-current="page">Сторінка закладу</a></li>
                <li><a href="about.html">Про проєкт</a></li>
                <li><a href="contacts.html">Контакти</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <article class="restaurant-details" id="restaurant-details">
            <h1 id="restaurant-name">Сторінка закладу</h1>
            <section class="info-section">
                <h2>Основна інформація</h2>
                <p><strong>Рейтинг:</strong> <span id="restaurant-rating"></span></p>
                <p><strong>Адреса:</strong> <span id="restaurant-address"></span></p>
                <p><span id="restaurant-description"></span></p>
            </section>
            <section class="menu-section">
                <h2>Меню закладу</h2>
                <ul class="menu-list" id="restaurant-menu"></ul>
            </section>
            <p><a href="search.html">Повернутися до результатів пошуку</a></p>
        </article>

                <h3>Залишити відгук</h3>
                <form action="#" method="POST" class="needs-validation">
                    <p class="form-summary" role="alert"></p>

                    <div class="form-group">
                        <label for="reviewer-name">Ваше ім'я:</label>
                        <input type="text" id="reviewer-name" name="reviewer-name" minlength="2" required>
                    </div>

                    <div class="form-group">
                        <label for="review-text">Коментар:</label>
                        <textarea id="review-text" name="review-text" rows="4" minlength="10" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="rating">Оцінка:</label>
                        <select id="rating" name="rating">
                            <option value="5">5 - Відмінно</option>
                            <option value="4">4 - Добре</option>
                            <option value="3">3 - Нормально</option>
                            <option value="2">2 - Погано</option>
                            <option value="1">1 - Жахливо</option>
                        </select>
                    </div>

                    <button type="submit">Надіслати відгук</button>
                </form>
            </section>
        </article>
    </main>

    <footer>
        <p>&copy; 2026 FoodMap. Усі права захищено.</p>
    </footer>
</body>
</html>
